name: CRAM arrow-harness audit

# Runs the Python arrow-harness audit (8 gate-qualification sections, must
# stay 8/8) and the pytest regression suite on every push/PR. No external
# dependencies beyond pytest -- audit.py and the cram_fhe package use only
# the Python standard library.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cram-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Arrow-harness audit (8 sections, must be 8/8)
        run: python3 -m cram_fhe.audit
      # `python3 -m pytest` (not bare `pytest`) is the invocation this repo
      # documents, in tests/test_cram_fhe.py's own docstring. It also puts CWD
      # on sys.path, which bare `pytest` does not -- that divergence is exactly
      # what broke this workflow on its first run (ModuleNotFoundError:
      # cram_fhe). pytest.ini now sets pythonpath so BOTH forms work; using the
      # documented form here is the second layer.
      - name: Regression suite
        run: python3 -m pytest tests/ -q
