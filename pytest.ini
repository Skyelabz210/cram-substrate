[pytest]
# The package lives at the repo root (cram_fhe/), and the tests import it as
# a top-level module. `python3 -m pytest` happens to work without this
# because `-m` puts the CWD on sys.path; a bare `pytest tests/ -q` does NOT,
# and fails with `ModuleNotFoundError: No module named 'cram_fhe'`.
#
# This was a live CI failure (cram-substrate audit workflow, 2026-08-26):
# the command was verified locally as `python3 -m pytest` but committed to
# the workflow as bare `pytest`. Setting pythonpath here makes BOTH
# invocations work, so the two can never diverge again.
pythonpath = .
testpaths = tests
